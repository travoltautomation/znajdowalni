<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fafaf8;color:#0f1115;font-family:Montserrat,Arial,sans-serif}main{max-width:1120px;margin:auto;padding:58px 30px}h1{font-size:13px;letter-spacing:.12em;margin:0 0 36px}.box{padding:42px;border:1px solid #e1e2df;margin-bottom:20px;background:#fff}.box.dark{background:#0f1115}.wide img{max-width:720px;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.grid img{max-width:100%;max-height:128px}.label{display:block;margin-bottom:24px;font-size:10px;letter-spacing:.1em;color:#66716a}.dark .label{color:#bfefec}@media(max-width:650px){main{padding:28px 18px}.box{padding:25px}.grid{grid-template-columns:1fr}}</style></head><body><main><h1>ZNAJDOWALNI  -  ZESTAW LOGO</h1><section class="box wide"><span class="label">LOGO PODSTAWOWE</span><img src="znajdowalni-primary.svg" alt="ZNAJDOWALNI  -  Daj się znaleźć klientom."></section><section class="grid"><div class="box"><span class="label">WORDMARK</span><img src="znajdowalni-wordmark.svg" alt="ZNAJDOWALNI"></div><div class="box"><span class="label">SYGNET</span><img src="znajdowalni-symbol.svg" alt="Sygnet Znajdowalni"></div><div class="box dark"><span class="label">APP ICON</span><img src="znajdowalni-app-icon.svg" alt="Ikona Znajdowalni"></div></section><section class="box dark wide"><span class="label">WERSJA NEGATYWOWA</span><img src="znajdowalni-reverse.svg" alt="ZNAJDOWALNI wersja negatywowa"></section></main></body></html>
